services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aifactory-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RAG_POSTGRES_DB:-aifactory_rag}
      POSTGRES_USER: ${RAG_POSTGRES_USER:-aifactory_rag}
      POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:-aifactory_rag}
    ports:
      - "${RAG_POSTGRES_PORT:-5432}:5432"
    volumes:
      - aifactory_rag_pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  rag-api:
    build:
      context: ../..
      dockerfile: services/rag/Dockerfile
    container_name: aifactory-rag-api
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      RAG_DATABASE_URL: postgresql://${RAG_POSTGRES_USER:-aifactory_rag}:${RAG_POSTGRES_PASSWORD:-aifactory_rag}@postgres:5432/${RAG_POSTGRES_DB:-aifactory_rag}
    ports:
      - "${RAG_API_BIND:-127.0.0.1}:${RAG_API_PORT:-8765}:8765"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  rag-web:
    build:
      context: ../..
      dockerfile: services/rag-web/Dockerfile
    container_name: aifactory-rag-web
    restart: unless-stopped
    environment:
      RAG_WEB_API_UPSTREAM: ${RAG_WEB_API_UPSTREAM:-http://host.docker.internal:8765}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${RAG_WEB_BIND:-127.0.0.1}:${RAG_WEB_PORT:-8080}:8080"

  # Data-flow queries over code property graphs (RQ-0025). Reachable from the
  # host only; the code it reads is mounted read-only, its graphs live in the
  # workspace. The heap stays below the container limit so the JVM cannot grow
  # into it.
  joern:
    build:
      context: ../joern
    image: aifactory-joern:v4.0.644
    container_name: aifactory-joern
    restart: unless-stopped
    mem_limit: ${RAG_JOERN_MEMORY:-4g}
    environment:
      JAVA_OPTS: -Xmx${RAG_JOERN_HEAP:-3g}
    ports:
      - "127.0.0.1:${RAG_JOERN_PORT:-8090}:8080"
    volumes:
      - ${RAG_GIT_MIRROR_DIR:-/srv/rag-sources/git}:${RAG_GIT_MIRROR_DIR:-/srv/rag-sources/git}:ro
      - /mnt:/mnt:ro
      - ${RAG_JOERN_WORKSPACE:-/srv/rag-sources/joern}:/workspace

volumes:
  aifactory_rag_pgdata:
