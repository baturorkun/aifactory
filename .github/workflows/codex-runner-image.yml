name: Codex Runner Image

on:
  push:
    branches: [main]
    paths:
      - docker/codex-runner.Dockerfile
      - .github/workflows/codex-runner-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: codex-runner-image-${{ github.ref }}
  cancel-in-progress: true

env:
  CODEX_VERSION: 0.147.0
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/aifactory-codex-runner

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Codex runner
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/codex-runner.Dockerfile
          push: true
          build-args: |
            CODEX_VERSION=${{ env.CODEX_VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=AI Factory runner with Codex CLI and CI dependencies
          tags: |
            ${{ env.IMAGE_NAME }}:codex-${{ env.CODEX_VERSION }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
