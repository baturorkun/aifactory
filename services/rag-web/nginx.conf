server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-src 'self' chrome-extension: moz-extension:; base-uri 'none'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass ${RAG_WEB_API_UPSTREAM}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location = /index.html {
        expires -1;
    }

    location = /app.js {
        expires -1;
    }

    location = /styles.css {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
